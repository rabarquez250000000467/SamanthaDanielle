<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sammy!</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Card Container */
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Status Badge */
    .status-badge {
      display: inline-block;
      background-color: #0e8a3a;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    /* Heading Section */
    .header-title {
      font-size: 2.2rem;
      color: #e2a98f;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .header-title .cake {
      font-size: 2.2rem;
      margin-right: 10px;
      vertical-align: middle;
    }

    /* Subtitle Text */
    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Inner Dark Message Box */
    .message-box {
      background-color: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px 20px;
      color: #64b5f6;
      font-size: 0.95rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* Action Button */
    .btn-read {
      display: block;
      width: 100%;
      background-color: #007acc;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
    }

    .btn-read:hover {
      background-color: #005999;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-badge">
      STATUS: SPECIAL DAY ❤️
    </div>

    <h1 class="header-title">
      <span class="cake">🎂</span>Happy Birthday Sammyyy!!!
    </h1>

    <p class="subtitle">
      A special note compiled just for you, cause I was not able to express my feelings earlier...
    </p>

    <div class="message-box">
      [MESSAGE] Press below to unlock your birthday note...
    </div>

    <button class="btn-read" onclick="alert('Happy Birthday!')">
      ❤️ Read Birthday Note
    </button>
  </div>

</body>
</html>
