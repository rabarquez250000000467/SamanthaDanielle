<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="card">
    <div class="badge">STATUS: SPECIAL DAY ❤️</div>
    <h1 id="greeting">🎂 Happy Birthday Sammyyyy!!!</h1>
    <p class="subtitle">A special note compiled just for you, cause I was not able to express my feelings earlier...</p>

    <div class="terminal" id="terminal">
      <div class="terminal-line">[MESSAGE] Press below to unlock your birthday note...</div>
    </div>

    <button id="celebrateBtn">❤️ Read Birthday Note</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
